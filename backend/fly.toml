# fly.toml app configuration file for e-commerce-mern
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'e-commerce-mern'
primary_region = 'ams'

[build]

[env]
  PORT = "5000"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256